name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug & release, lint, unit tests
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Verify release signing configuration
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass ci-pass -keypass ci-pass \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI signing check"
          BMF_KEYSTORE_FILE="$RUNNER_TEMP/ci.jks" BMF_KEYSTORE_PASSWORD=ci-pass BMF_KEY_ALIAS=ci BMF_KEY_PASSWORD=ci-pass \
            ./gradlew assembleRelease bundleRelease
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "CN=CI signing check"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep "jar verified"
          # Leave the unsigned APK in place for the emulator smoke test.
          ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  device-test:
    name: UI tests & release smoke test (emulator)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/device-checks.sh

      - name: Upload screenshots & logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: device-results
          path: |
            device-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
