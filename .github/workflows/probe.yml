name: Probe versions
on:
  push:
    branches: [ "claude/**" ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest stable versions on Google Maven
        run: |
          for ga in com.android.tools.build:gradle com.google.android.material:material \
            com.google.android.gms:play-services-location androidx.core:core-splashscreen \
            androidx.core:core-ktx androidx.appcompat:appcompat androidx.test.ext:junit \
            androidx.test.espresso:espresso-core androidx.activity:activity-ktx \
            androidx.fragment:fragment-ktx androidx.lifecycle:lifecycle-runtime-ktx \
            androidx.viewpager2:viewpager2 androidx.recyclerview:recyclerview \
            androidx.constraintlayout:constraintlayout androidx.coordinatorlayout:coordinatorlayout \
            androidx.swiperefreshlayout:swiperefreshlayout androidx.test:core; do
            g=${ga%%:*}; a=${ga##*:}
            v=$(curl -sSL "https://dl.google.com/dl/android/maven2/${g//.//}/$a/maven-metadata.xml" \
              | grep -oP '(?<=<version>)[^<]+' | grep -viE 'alpha|beta|rc|dev' | sort -V | tail -1)
            echo "$ga -> $v"
          done
